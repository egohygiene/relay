# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

name: "🧠 Repository Intelligence"
description: >-
  Build a deterministic, visibility-aware Repository Intelligence site with a
  shared shell, operational Now view, scrollable roadmap quest line, ADR
  decision ledger, semantic Git journey, focused dependencies, health, releases,
  work, search, and comparison views, an analytics dashboard, and a searchable
  source tree. The action writes static files but never deploys them.

inputs:
  output-directory:
    description: "Repository-relative directory receiving the validated static dashboard subtree."
    required: false
    default: "dist/intelligence"
  work-directory:
    description: >-
      Repository-relative private working directory for source contracts and
      diagnostic activity reports. Do not publish this directory wholesale.
    required: false
    default: ".cache/repository-intelligence"
  reports-directory:
    description: >-
      Repository-relative root containing optional normalized summaries at
      <producer>/summary.json. A missing directory renders honest unavailable states.
    required: false
    default: ".reports"
  observatory-snapshot:
    description: >-
      Optional repository-relative path to a public-safe Observatory Repository
      Intelligence read model for the represented commit. When omitted, the
      evidence-backed views render explicit unavailable states instead of inferring
      repository truth.
    required: false
    default: ""
  observatory-comparison:
    description: >-
      Optional repository-relative path to a public-safe Observatory Repository
      Intelligence comparison whose after boundary matches observatory-snapshot
      and the represented commit. Requires observatory-snapshot when supplied.
    required: false
    default: ""
  repository:
    description: >-
      Repository in owner/name form for local contexts. It cannot override the
      workflow repository when GitHub supplies repository metadata.
    required: false
    default: ""
  repository-visibility:
    description: >-
      Consumer visibility for local contexts without repository event metadata.
      It cannot override GitHub's public, private, or internal classification.
    required: false
    default: ""
  default-branch:
    description: >-
      Default branch shown by the repository vitality card. Defaults to the
      workflow repository default branch, then main when event metadata is absent.
    required: false
    default: ""
  source-commit:
    description: >-
      Full commit SHA represented by the dashboard. Defaults to the commit
      resolved from activity-ref.
    required: false
    default: ""
  as-of:
    description: >-
      Optional RFC 3339 instant for deterministic freshness evaluation.
      Defaults to the represented commit timestamp.
    required: false
    default: ""
  activity-ref:
    description: "Branch, tag, or revision inspected by repository collectors."
    required: false
    default: "HEAD"
  activity-since:
    description: >-
      ISO-8601 date/timestamp or deterministic relative window such as
      '1 year ago', anchored to the represented commit.
    required: false
    default: "1 year ago"
  activity-author:
    description: "Optional Git author pattern used to filter private diagnostic activity."
    required: false
    default: ""
  max-depth:
    description: "Maximum repository depth represented by tree artifacts."
    required: false
    default: "10"
  excluded-paths:
    description: "Comma-separated paths or directory names excluded from the repository tree."
    required: false
    default: ".git,.staging,.cache,.venv,.reports,.site,docs/generated,node_modules,vendor,dist,build,coverage,__pycache__"
  analytics-excluded-paths:
    description: >-
      Comma-separated generated, cached, or vendored paths excluded from
      public analytics while remaining eligible for the repository tree.
    required: false
    default: ".git,.staging,.cache,.venv,.tox,.mypy_cache,.ruff_cache,.reports,.site,docs/generated,node_modules,vendor,dist,build,coverage,__pycache__,target"
  require-full-history:
    description: "Fail rather than publishing incomplete activity from a shallow checkout."
    required: false
    default: "true"

outputs:
  output-directory:
    description: "Repository-relative directory containing the routed Repository Intelligence bundle."
    value: "${{ inputs.output-directory }}"
  index:
    description: "Repository-relative path to the Repository Intelligence overview."
    value: "${{ inputs.output-directory }}/index.html"
  now:
    description: "Repository-relative path to the routed Now view."
    value: "${{ inputs.output-directory }}/now/index.html"
  roadmap:
    description: "Repository-relative path to the scrollable roadmap quest-line view."
    value: "${{ inputs.output-directory }}/roadmap/index.html"
  decisions:
    description: "Repository-relative path to the ADR decision-ledger view."
    value: "${{ inputs.output-directory }}/decisions/index.html"
  journey:
    description: "Repository-relative path to the semantic Git journey view."
    value: "${{ inputs.output-directory }}/journey/index.html"
  dependencies:
    description: "Repository-relative path to the directed dependency-impact view."
    value: "${{ inputs.output-directory }}/dependencies/index.html"
  health:
    description: "Repository-relative path to the normalized check-evidence view."
    value: "${{ inputs.output-directory }}/health/index.html"
  releases:
    description: "Repository-relative path to the shipped release-evidence view."
    value: "${{ inputs.output-directory }}/releases/index.html"
  work:
    description: "Repository-relative path to the active-work orientation view."
    value: "${{ inputs.output-directory }}/work/index.html"
  search:
    description: "Repository-relative path to normalized entity search."
    value: "${{ inputs.output-directory }}/search/index.html"
  compare:
    description: "Repository-relative path to structural snapshot comparison."
    value: "${{ inputs.output-directory }}/compare/index.html"
  dashboard:
    description: "Repository-relative path to the compatibility analytics dashboard."
    value: "${{ inputs.output-directory }}/dashboard/index.html"
  summary:
    description: "Repository-relative path to the aggregate dashboard projection."
    value: "${{ inputs.output-directory }}/summary.json"
  provenance:
    description: "Repository-relative path to deterministic generator and source provenance."
    value: "${{ inputs.output-directory }}/provenance.json"
  build-manifest:
    description: "Repository-relative path to the deterministic build manifest."
    value: "${{ inputs.output-directory }}/build-manifest.json"
  build-manifest-sha256:
    description: "Tagged SHA-256 digest of the exact deterministic build manifest."
    value: "${{ steps.build_manifest.outputs.manifest-sha256 }}"
  bundle-digest:
    description: "Tagged deterministic digest of the Repository Intelligence payload inventory."
    value: "${{ steps.build_manifest.outputs.bundle-digest }}"
  analytics-summary:
    description: "Repository-relative path to the public repository analytics contract."
    value: "${{ inputs.work-directory }}/analytics/summary.json"
  repository-tree:
    description: "Repository-relative path to the commit-scoped repository tree contract."
    value: "${{ inputs.work-directory }}/tree/repo.json"
  diagnostics-directory:
    description: >-
      Repository-relative directory containing private diagnostic activity data;
      contributor identity and commit messages may be present.
    value: "${{ inputs.work-directory }}/activity"

branding:
  icon: "activity"
  color: "purple"

runs:
  using: "composite"
  steps:
    - name: "🔎 Validate inputs and resolve source metadata"
      id: metadata
      shell: bash
      env:
        EVENT_DEFAULT_BRANCH: "${{ github.event.repository.default_branch }}"
        EVENT_REPOSITORY_PRIVATE: "${{ github.event.repository.private }}"
        EVENT_REPOSITORY_VISIBILITY: "${{ github.event.repository.visibility }}"
        INPUT_ACTIVITY_REF: "${{ inputs.activity-ref }}"
        INPUT_AS_OF: "${{ inputs.as-of }}"
        INPUT_DEFAULT_BRANCH: "${{ inputs.default-branch }}"
        INPUT_MAX_DEPTH: "${{ inputs.max-depth }}"
        INPUT_OUTPUT_DIRECTORY: "${{ inputs.output-directory }}"
        INPUT_OBSERVATORY_COMPARISON: "${{ inputs.observatory-comparison }}"
        INPUT_OBSERVATORY_SNAPSHOT: "${{ inputs.observatory-snapshot }}"
        INPUT_REPORTS_DIRECTORY: "${{ inputs.reports-directory }}"
        INPUT_REPOSITORY: "${{ inputs.repository }}"
        INPUT_REPOSITORY_VISIBILITY: "${{ inputs.repository-visibility }}"
        INPUT_REQUIRE_FULL_HISTORY: "${{ inputs.require-full-history }}"
        INPUT_SOURCE_COMMIT: "${{ inputs.source-commit }}"
        INPUT_WORK_DIRECTORY: "${{ inputs.work-directory }}"
        RELAY_ACTION_REF: "${{ github.action_ref }}"
        RELAY_ACTION_REPOSITORY: "${{ github.action_repository }}"
        RELAY_WORKFLOW_REF: "${{ job.workflow_ref }}"
        RELAY_WORKFLOW_REPOSITORY: "${{ job.workflow_repository }}"
        RELAY_WORKFLOW_SHA: "${{ job.workflow_sha }}"
      run: |
        set -euo pipefail

        validate_relative_path() {
          local label="$1"
          local value="$2"
          if [[ ! "${value}" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] \
            || "/${value}/" == */./* \
            || "/${value}/" == */../*; then
            printf '%s must use canonical, literal repository-relative path segments: %q\n' \
              "${label}" "${value}" >&2
            return 2
          fi
        }

        validate_relative_path "output-directory" "${INPUT_OUTPUT_DIRECTORY}"
        validate_relative_path "work-directory" "${INPUT_WORK_DIRECTORY}"
        validate_relative_path "reports-directory" "${INPUT_REPORTS_DIRECTORY}"
        if [[ -n "${INPUT_OBSERVATORY_SNAPSHOT}" ]]; then
          validate_relative_path "observatory-snapshot" "${INPUT_OBSERVATORY_SNAPSHOT}"
          if [[ "${INPUT_OBSERVATORY_SNAPSHOT}/" == "${INPUT_OUTPUT_DIRECTORY}/"* \
            || "${INPUT_OUTPUT_DIRECTORY}/" == "${INPUT_OBSERVATORY_SNAPSHOT}/"* ]]; then
            printf 'observatory-snapshot and output-directory must not overlap\n' >&2
            exit 2
          fi
        fi
        if [[ -n "${INPUT_OBSERVATORY_COMPARISON}" ]]; then
          validate_relative_path "observatory-comparison" "${INPUT_OBSERVATORY_COMPARISON}"
          if [[ -z "${INPUT_OBSERVATORY_SNAPSHOT}" ]]; then
            printf 'observatory-comparison requires observatory-snapshot\n' >&2
            exit 2
          fi
          if [[ "${INPUT_OBSERVATORY_COMPARISON}" == "${INPUT_OBSERVATORY_SNAPSHOT}" ]]; then
            printf 'observatory-comparison and observatory-snapshot must be different files\n' >&2
            exit 2
          fi
          if [[ "${INPUT_OBSERVATORY_COMPARISON}/" == "${INPUT_OUTPUT_DIRECTORY}/"* \
            || "${INPUT_OUTPUT_DIRECTORY}/" == "${INPUT_OBSERVATORY_COMPARISON}/"* ]]; then
            printf 'observatory-comparison and output-directory must not overlap\n' >&2
            exit 2
          fi
        fi

        case "${INPUT_OUTPUT_DIRECTORY%%/*}" in
          .git | .github | actions | schemas | scripts | tests)
            printf 'output-directory must not replace a protected repository area: %s\n' \
              "${INPUT_OUTPUT_DIRECTORY}" >&2
            exit 2
            ;;
          *) ;;
        esac
        case "${INPUT_WORK_DIRECTORY%%/*}" in
          .git | .github | actions | schemas | scripts | tests)
            printf 'work-directory must not replace a protected repository area: %s\n' \
              "${INPUT_WORK_DIRECTORY}" >&2
            exit 2
            ;;
          *) ;;
        esac

        if [[ "${INPUT_WORK_DIRECTORY}/" == "${INPUT_OUTPUT_DIRECTORY}/"* \
          || "${INPUT_OUTPUT_DIRECTORY}/" == "${INPUT_WORK_DIRECTORY}/"* ]]; then
          printf 'work-directory and output-directory must not overlap; private diagnostics could be published\n' >&2
          exit 2
        fi
        if [[ "${INPUT_REPORTS_DIRECTORY}/" == "${INPUT_OUTPUT_DIRECTORY}/"* \
          || "${INPUT_OUTPUT_DIRECTORY}/" == "${INPUT_REPORTS_DIRECTORY}/"* ]]; then
          printf 'reports-directory and output-directory must not overlap; report evidence must remain outside the public output\n' >&2
          exit 2
        fi
        if [[ ! "${INPUT_MAX_DEPTH}" =~ ^[0-9]+$ ]] || (( INPUT_MAX_DEPTH < 1 || INPUT_MAX_DEPTH > 20 )); then
          printf 'max-depth must be an integer from 1 through 20: %s\n' "${INPUT_MAX_DEPTH}" >&2
          exit 2
        fi
        if [[ "${INPUT_REQUIRE_FULL_HISTORY}" != "true" && "${INPUT_REQUIRE_FULL_HISTORY}" != "false" ]]; then
          printf 'require-full-history must be true or false: %s\n' "${INPUT_REQUIRE_FULL_HISTORY}" >&2
          exit 2
        fi

        source_commit="${INPUT_SOURCE_COMMIT}"
        if [[ -z "${source_commit}" ]]; then
          source_commit="$(git -C "${GITHUB_WORKSPACE}" rev-parse "${INPUT_ACTIVITY_REF}^{commit}")"
        fi
        if [[ ! "${source_commit}" =~ ^[0-9a-f]{40}$ ]]; then
          printf 'source-commit must resolve to a full lowercase Git SHA: %s\n' "${source_commit}" >&2
          exit 2
        fi
        resolved_ref_commit="$(git -C "${GITHUB_WORKSPACE}" rev-parse "${INPUT_ACTIVITY_REF}^{commit}")"
        if [[ "${source_commit}" != "${resolved_ref_commit}" ]]; then
          printf 'source-commit (%s) must match activity-ref (%s -> %s)\n' \
            "${source_commit}" "${INPUT_ACTIVITY_REF}" "${resolved_ref_commit}" >&2
          exit 2
        fi
        source_epoch="$(git -C "${GITHUB_WORKSPACE}" show --no-patch --format=%ct "${source_commit}")"
        if [[ ! "${source_epoch}" =~ ^[0-9]+$ ]]; then
          printf 'represented source epoch is unavailable\n' >&2
          exit 2
        fi

        if [[ -n "${GITHUB_REPOSITORY:-}" \
          && -n "${INPUT_REPOSITORY}" \
          && "${INPUT_REPOSITORY,,}" != "${GITHUB_REPOSITORY,,}" ]]; then
          printf 'repository must not override the GitHub workflow repository\n' >&2
          exit 2
        fi
        repository="${GITHUB_REPOSITORY:-${INPUT_REPOSITORY:-}}"
        if [[ -z "${repository}" ]]; then
          repository="local/$(basename "${GITHUB_WORKSPACE}")"
        fi
        if [[ ! "${repository}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
          printf 'repository must use owner/name form: %s\n' "${repository}" >&2
          exit 2
        fi
        if [[ "${repository%%/*}" == "." \
          || "${repository%%/*}" == ".." \
          || "${repository#*/}" == "." \
          || "${repository#*/}" == ".." ]]; then
          printf 'repository owner and name must not be dot segments\n' >&2
          exit 2
        fi

        as_of="${INPUT_AS_OF}"
        timestamp_source="explicit-input"
        if [[ -z "${as_of}" ]]; then
          as_of="$(git -C "${GITHUB_WORKSPACE}" show --no-patch --format=%cI "${source_commit}")"
          timestamp_source="consumer-source-commit"
        fi
        python3 -I - "${as_of}" <<'PYTHON'
        from datetime import datetime
        import sys

        value = sys.argv[1]
        normalized = value[:-1] + "+00:00" if value.endswith("Z") else value
        parsed = datetime.fromisoformat(normalized)
        if parsed.tzinfo is None:
            raise SystemExit("as-of must be an RFC 3339 timestamp with a timezone")
        PYTHON

        default_branch="${INPUT_DEFAULT_BRANCH:-${EVENT_DEFAULT_BRANCH:-main}}"
        if [[ ! "${default_branch}" =~ ^[^[:space:][:cntrl:]]+$ ]]; then
          printf 'default-branch must be a non-empty Git ref without whitespace\n' >&2
          exit 2
        fi
        generator_repository="${RELAY_ACTION_REPOSITORY}"
        generator_ref="${RELAY_ACTION_REF}"
        generator_commit=""
        generator_immutable="false"
        if [[ "${RELAY_WORKFLOW_REPOSITORY}" == "egohygiene/relay" \
          && "${RELAY_WORKFLOW_REF}" == egohygiene/relay/.github/workflows/repository-intelligence.yml@* \
          && "${RELAY_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
          generator_repository="${RELAY_WORKFLOW_REPOSITORY}"
          generator_ref="${RELAY_WORKFLOW_REF}"
          generator_commit="${RELAY_WORKFLOW_SHA}"
          if [[ "${generator_ref}" =~ @([0-9a-f]{40})$ \
            && "${BASH_REMATCH[1]}" == "${generator_commit}" ]]; then
            generator_immutable="true"
          fi
        elif [[ "${generator_repository}" == "egohygiene/relay" \
          && "${generator_ref}" =~ ^[0-9a-f]{40}$ ]]; then
          generator_commit="${generator_ref}"
          generator_immutable="true"
        fi
        if [[ "${generator_repository}" != "egohygiene/relay" ]]; then
          printf 'Repository Intelligence generator must resolve to egohygiene/relay\n' >&2
          exit 2
        fi
        generator_version="$(python3 -I - "${GITHUB_ACTION_PATH}/../../release.json" <<'PYTHON'
        import json
        from pathlib import Path
        import sys

        release = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
        version = release.get("version", "")
        if not isinstance(version, str) or not version.startswith("v"):
            raise SystemExit("Relay release.json has no exact version")
        print(version[1:])
        PYTHON
        )"

        event_visibility="${EVENT_REPOSITORY_VISIBILITY}"
        if [[ -z "${event_visibility}" ]]; then
          case "${EVENT_REPOSITORY_PRIVATE}" in
            true) event_visibility="private" ;;
            false) event_visibility="public" ;;
            *) ;;
          esac
        fi
        if [[ -n "${event_visibility}" \
          && -n "${INPUT_REPOSITORY_VISIBILITY}" \
          && "${INPUT_REPOSITORY_VISIBILITY}" != "${event_visibility}" ]]; then
          printf 'repository-visibility must not override GitHub repository visibility\n' >&2
          exit 2
        fi
        repository_visibility="${event_visibility:-${INPUT_REPOSITORY_VISIBILITY:-unknown}}"
        case "${repository_visibility}" in
          public | private | internal | unknown) ;;
          *)
            printf 'repository-visibility must be public, private, internal, or unknown\n' >&2
            exit 2
            ;;
        esac

        python3 "${GITHUB_ACTION_PATH}/scripts/prepare_output_directory.py" \
          --repository-root "${GITHUB_WORKSPACE}" \
          --output-directory "${INPUT_OUTPUT_DIRECTORY}" \
          --work-directory "${INPUT_WORK_DIRECTORY}" \
          --reports-directory "${INPUT_REPORTS_DIRECTORY}" \
          --validate-layout-only

        mkdir -p "${GITHUB_WORKSPACE}/${INPUT_WORK_DIRECTORY}/activity"
        mkdir -p "${GITHUB_WORKSPACE}/${INPUT_WORK_DIRECTORY}/analytics"
        mkdir -p "${GITHUB_WORKSPACE}/${INPUT_WORK_DIRECTORY}/tree"
        mkdir -p "${GITHUB_WORKSPACE}/${INPUT_WORK_DIRECTORY}/visualization"
        printf 'source-commit=%s\n' "${source_commit}" >> "${GITHUB_OUTPUT}"
        printf 'repository=%s\n' "${repository}" >> "${GITHUB_OUTPUT}"
        printf 'repository-visibility=%s\n' "${repository_visibility}" >> "${GITHUB_OUTPUT}"
        printf 'as-of=%s\n' "${as_of}" >> "${GITHUB_OUTPUT}"
        printf 'default-branch=%s\n' "${default_branch}" >> "${GITHUB_OUTPUT}"
        printf 'timestamp-source=%s\n' "${timestamp_source}" >> "${GITHUB_OUTPUT}"
        printf 'generator-version=%s\n' "${generator_version}" >> "${GITHUB_OUTPUT}"
        printf 'generator-repository=%s\n' "${generator_repository}" >> "${GITHUB_OUTPUT}"
        printf 'generator-ref=%s\n' "${generator_ref}" >> "${GITHUB_OUTPUT}"
        printf 'generator-commit=%s\n' "${generator_commit}" >> "${GITHUB_OUTPUT}"
        printf 'generator-immutable=%s\n' "${generator_immutable}" >> "${GITHUB_OUTPUT}"
        printf 'source-epoch=%s\n' "${source_epoch}" >> "${GITHUB_OUTPUT}"

    - name: "🌳 Generate commit-scoped repository tree"
      shell: bash
      env:
        INPUT_ACTIVITY_REF: "${{ inputs.activity-ref }}"
        INPUT_EXCLUDED_PATHS: "${{ inputs.excluded-paths }}"
        INPUT_MAX_DEPTH: "${{ inputs.max-depth }}"
        INPUT_OUTPUT_DIRECTORY: "${{ inputs.output-directory }}"
        INPUT_REPORTS_DIRECTORY: "${{ inputs.reports-directory }}"
        INPUT_WORK_DIRECTORY: "${{ inputs.work-directory }}"
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/scripts/generate_repository_intelligence.py" \
          --repo-root "${GITHUB_WORKSPACE}" \
          --output-root "${GITHUB_WORKSPACE}/${INPUT_WORK_DIRECTORY}" \
          --ref "${INPUT_ACTIVITY_REF}" \
          --max-depth "${INPUT_MAX_DEPTH}" \
          --excluded-paths "${INPUT_EXCLUDED_PATHS},${INPUT_WORK_DIRECTORY},${INPUT_REPORTS_DIRECTORY},${INPUT_OUTPUT_DIRECTORY}"

    - name: "📊 Generate private diagnostic activity"
      shell: bash
      env:
        INPUT_ACTIVITY_AUTHOR: "${{ inputs.activity-author }}"
        INPUT_ACTIVITY_REF: "${{ inputs.activity-ref }}"
        INPUT_ACTIVITY_SINCE: "${{ inputs.activity-since }}"
        INPUT_REQUIRE_FULL_HISTORY: "${{ inputs.require-full-history }}"
        INPUT_WORK_DIRECTORY: "${{ inputs.work-directory }}"
      run: |
        set -euo pipefail
        arguments=(
          --repo "${GITHUB_WORKSPACE}"
          --output "${INPUT_WORK_DIRECTORY}/activity"
          --since "${INPUT_ACTIVITY_SINCE}"
          --ref "${INPUT_ACTIVITY_REF}"
          --color never
        )
        if [[ -n "${INPUT_ACTIVITY_AUTHOR}" ]]; then
          arguments+=(--author "${INPUT_ACTIVITY_AUTHOR}")
        fi
        if [[ "${INPUT_REQUIRE_FULL_HISTORY}" == "true" ]]; then
          arguments+=(--require-full-history)
        fi
        bash "${GITHUB_ACTION_PATH}/scripts/repo-activity" "${arguments[@]}"

    - name: "🪩 Generate public-safe repository analytics"
      shell: bash
      env:
        INPUT_ACTIVITY_REF: "${{ inputs.activity-ref }}"
        INPUT_ACTIVITY_SINCE: "${{ inputs.activity-since }}"
        INPUT_ANALYTICS_EXCLUDED_PATHS: "${{ inputs.analytics-excluded-paths }}"
        INPUT_OUTPUT_DIRECTORY: "${{ inputs.output-directory }}"
        INPUT_REPORTS_DIRECTORY: "${{ inputs.reports-directory }}"
        INPUT_WORK_DIRECTORY: "${{ inputs.work-directory }}"
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/scripts/generate_repository_analytics.py" \
          --repo-root "${GITHUB_WORKSPACE}" \
          --output "${GITHUB_WORKSPACE}/${INPUT_WORK_DIRECTORY}/analytics/summary.json" \
          --ref "${INPUT_ACTIVITY_REF}" \
          --since "${INPUT_ACTIVITY_SINCE}" \
          --excluded-paths "${INPUT_ANALYTICS_EXCLUDED_PATHS},${INPUT_WORK_DIRECTORY},${INPUT_REPORTS_DIRECTORY},${INPUT_OUTPUT_DIRECTORY}"

    - name: "✨ Render static intelligence site"
      shell: bash
      env:
        INPUT_OBSERVATORY_COMPARISON: "${{ inputs.observatory-comparison }}"
        INPUT_OBSERVATORY_SNAPSHOT: "${{ inputs.observatory-snapshot }}"
        INPUT_OUTPUT_DIRECTORY: "${{ inputs.output-directory }}"
        INPUT_REPORTS_DIRECTORY: "${{ inputs.reports-directory }}"
        INPUT_WORK_DIRECTORY: "${{ inputs.work-directory }}"
        RESOLVED_AS_OF: "${{ steps.metadata.outputs.as-of }}"
        RESOLVED_DEFAULT_BRANCH: "${{ steps.metadata.outputs.default-branch }}"
        RESOLVED_GENERATOR_COMMIT: "${{ steps.metadata.outputs.generator-commit }}"
        RESOLVED_GENERATOR_IMMUTABLE: "${{ steps.metadata.outputs.generator-immutable }}"
        RESOLVED_GENERATOR_REF: "${{ steps.metadata.outputs.generator-ref }}"
        RESOLVED_GENERATOR_REPOSITORY: "${{ steps.metadata.outputs.generator-repository }}"
        RESOLVED_GENERATOR_VERSION: "${{ steps.metadata.outputs.generator-version }}"
        RESOLVED_REPOSITORY: "${{ steps.metadata.outputs.repository }}"
        RESOLVED_REPOSITORY_VISIBILITY: "${{ steps.metadata.outputs.repository-visibility }}"
        RESOLVED_SOURCE_COMMIT: "${{ steps.metadata.outputs.source-commit }}"
        RESOLVED_TIMESTAMP_SOURCE: "${{ steps.metadata.outputs.timestamp-source }}"
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/scripts/prepare_output_directory.py" \
          --repository-root "${GITHUB_WORKSPACE}" \
          --output-directory "${INPUT_OUTPUT_DIRECTORY}"
        python3 "${GITHUB_ACTION_PATH}/scripts/generate_repository_intelligence_dashboard.py" \
          --repository-root "${GITHUB_WORKSPACE}" \
          --reports-root "${GITHUB_WORKSPACE}/${INPUT_REPORTS_DIRECTORY}" \
          --analytics-summary "${GITHUB_WORKSPACE}/${INPUT_WORK_DIRECTORY}/analytics/summary.json" \
          --repository-tree "${GITHUB_WORKSPACE}/${INPUT_WORK_DIRECTORY}/tree/repo.json" \
          --output-root "${GITHUB_WORKSPACE}/${INPUT_OUTPUT_DIRECTORY}" \
          --repository "${RESOLVED_REPOSITORY}" \
          --default-branch "${RESOLVED_DEFAULT_BRANCH}" \
          --source-commit "${RESOLVED_SOURCE_COMMIT}" \
          --as-of "${RESOLVED_AS_OF}" \
          --timestamp-source "${RESOLVED_TIMESTAMP_SOURCE}" \
          --generator-version "${RESOLVED_GENERATOR_VERSION}" \
          --generator-repository "${RESOLVED_GENERATOR_REPOSITORY}" \
          --generator-ref "${RESOLVED_GENERATOR_REF}" \
          --generator-commit "${RESOLVED_GENERATOR_COMMIT}" \
          --generator-immutable "${RESOLVED_GENERATOR_IMMUTABLE}" \
          --consumer-visibility "${RESOLVED_REPOSITORY_VISIBILITY}" \
          --stylesheet-source "${GITHUB_ACTION_PATH}/assets/dashboard.css" \
          --script-source "${GITHUB_ACTION_PATH}/assets/explorer.js" \
          --dashboard-subdirectory "dashboard"
        snapshot_arguments=()
        if [[ -n "${INPUT_OBSERVATORY_SNAPSHOT}" ]]; then
          snapshot_arguments+=(
            --snapshot "${GITHUB_WORKSPACE}/${INPUT_OBSERVATORY_SNAPSHOT}"
          )
        fi
        python3 "${GITHUB_ACTION_PATH}/scripts/generate_repository_intelligence_site.py" \
          --repository-root "${GITHUB_WORKSPACE}" \
          --output-root "${GITHUB_WORKSPACE}/${INPUT_OUTPUT_DIRECTORY}" \
          --summary "${GITHUB_WORKSPACE}/${INPUT_OUTPUT_DIRECTORY}/summary.json" \
          --provenance "${GITHUB_WORKSPACE}/${INPUT_OUTPUT_DIRECTORY}/provenance.json" \
          --repository "${RESOLVED_REPOSITORY}" \
          --source-commit "${RESOLVED_SOURCE_COMMIT}" \
          --stylesheet-source "${GITHUB_ACTION_PATH}/assets/site.css" \
          --script-source "${GITHUB_ACTION_PATH}/assets/site.js" \
          "${snapshot_arguments[@]}"
        python3 "${GITHUB_ACTION_PATH}/scripts/render_repository_intelligence_dependencies.py" \
          --repository-root "${GITHUB_WORKSPACE}" \
          --output-root "${GITHUB_WORKSPACE}/${INPUT_OUTPUT_DIRECTORY}" \
          --summary "${GITHUB_WORKSPACE}/${INPUT_OUTPUT_DIRECTORY}/summary.json" \
          --provenance "${GITHUB_WORKSPACE}/${INPUT_OUTPUT_DIRECTORY}/provenance.json" \
          --repository "${RESOLVED_REPOSITORY}" \
          --source-commit "${RESOLVED_SOURCE_COMMIT}" \
          "${snapshot_arguments[@]}"
        comparison_arguments=()
        if [[ -n "${INPUT_OBSERVATORY_COMPARISON}" ]]; then
          comparison_arguments+=(
            --comparison "${GITHUB_WORKSPACE}/${INPUT_OBSERVATORY_COMPARISON}"
          )
        fi
        python3 "${GITHUB_ACTION_PATH}/scripts/render_repository_intelligence_compare.py" \
          --repository-root "${GITHUB_WORKSPACE}" \
          --output-root "${GITHUB_WORKSPACE}/${INPUT_OUTPUT_DIRECTORY}" \
          --summary "${GITHUB_WORKSPACE}/${INPUT_OUTPUT_DIRECTORY}/summary.json" \
          --provenance "${GITHUB_WORKSPACE}/${INPUT_OUTPUT_DIRECTORY}/provenance.json" \
          --repository "${RESOLVED_REPOSITORY}" \
          --source-commit "${RESOLVED_SOURCE_COMMIT}" \
          "${snapshot_arguments[@]}" \
          "${comparison_arguments[@]}"

    - name: "🧾 Create deterministic build manifest"
      id: build_manifest
      shell: bash
      env:
        INPUT_OUTPUT_DIRECTORY: "${{ inputs.output-directory }}"
        RESOLVED_GENERATOR_COMMIT: "${{ steps.metadata.outputs.generator-commit }}"
        RESOLVED_GENERATOR_VERSION: "${{ steps.metadata.outputs.generator-version }}"
        RESOLVED_REPOSITORY: "${{ steps.metadata.outputs.repository }}"
        RESOLVED_SOURCE_COMMIT: "${{ steps.metadata.outputs.source-commit }}"
        RESOLVED_SOURCE_EPOCH: "${{ steps.metadata.outputs.source-epoch }}"
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/scripts/create_repository_intelligence_build_manifest.py" \
          --repository-root "${GITHUB_WORKSPACE}" \
          --output-root "${GITHUB_WORKSPACE}/${INPUT_OUTPUT_DIRECTORY}" \
          --repository "${RESOLVED_REPOSITORY}" \
          --consumer-revision "${RESOLVED_SOURCE_COMMIT}" \
          --generator-revision "${RESOLVED_GENERATOR_COMMIT}" \
          --generator-version "${RESOLVED_GENERATOR_VERSION}" \
          --source-epoch "${RESOLVED_SOURCE_EPOCH}" \
          --github-output "${GITHUB_OUTPUT}"

    - name: "🛡️ Validate generated intelligence bundle"
      shell: bash
      env:
        INPUT_OUTPUT_DIRECTORY: "${{ inputs.output-directory }}"
        RESOLVED_GENERATOR_COMMIT: "${{ steps.metadata.outputs.generator-commit }}"
        RESOLVED_GENERATOR_IMMUTABLE: "${{ steps.metadata.outputs.generator-immutable }}"
        RESOLVED_GENERATOR_REF: "${{ steps.metadata.outputs.generator-ref }}"
        RESOLVED_GENERATOR_VERSION: "${{ steps.metadata.outputs.generator-version }}"
        RESOLVED_REPOSITORY: "${{ steps.metadata.outputs.repository }}"
        RESOLVED_REPOSITORY_VISIBILITY: "${{ steps.metadata.outputs.repository-visibility }}"
        RESOLVED_SOURCE_COMMIT: "${{ steps.metadata.outputs.source-commit }}"
        RESOLVED_SOURCE_EPOCH: "${{ steps.metadata.outputs.source-epoch }}"
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/scripts/validate_repository_intelligence_bundle.py" \
          --repository-root "${GITHUB_WORKSPACE}" \
          --output-root "${GITHUB_WORKSPACE}/${INPUT_OUTPUT_DIRECTORY}" \
          --repository "${RESOLVED_REPOSITORY}" \
          --repository-visibility "${RESOLVED_REPOSITORY_VISIBILITY}" \
          --source-commit "${RESOLVED_SOURCE_COMMIT}" \
          --generator-version "${RESOLVED_GENERATOR_VERSION}" \
          --generator-source-ref "${RESOLVED_GENERATOR_REF}" \
          --generator-source-commit "${RESOLVED_GENERATOR_COMMIT}" \
          --generator-immutable "${RESOLVED_GENERATOR_IMMUTABLE}" \
          --source-epoch "${RESOLVED_SOURCE_EPOCH}"
