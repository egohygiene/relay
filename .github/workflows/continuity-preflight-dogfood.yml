# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Relay continuity preflight

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: "relay-continuity-dogfood-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  continuity:
    permissions:
      contents: read
    uses: $/.github/workflows/continuity-preflight.yml
    with:
      repository-id: "egohygiene/relay"
      visibility: "public"
      base-revision: "${{ github.event.pull_request.base.sha }}"
      head-revision: "working-tree"
      disposition: "updated"
      transition: "pull-request"
      rollout-mode: "observe"
      evaluation-date: "${{ github.event.pull_request.updated_at }}"
      live-evidence-status: "verified"
      live-evidence-references: '["${{ github.event.pull_request.html_url }}"]'
      artifact-retention-days: 14
