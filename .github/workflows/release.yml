---
# Copyright 2026 Ego Hygiene
# SPDX-License-Identifier: MIT
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release Relay actions

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Reviewed version already promoted in CHANGELOG.md and release.json."
        required: true
        type: string
      update-major-alias:
        description: "Advance the matching moving major discovery alias."
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: "relay-release-${{ inputs.version }}"
  cancel-in-progress: false

jobs:
  bundle:
    name: Build Relay's reviewed profile bundle
    if: "${{ github.ref_name == github.event.repository.default_branch }}"
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Harden runner
        # step-security/harden-runner v2.21.0
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Check out exact default-branch commit
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require reviewed version authority agreement
        shell: bash
        env:
          DEFAULT_BRANCH: "${{ github.event.repository.default_branch }}"
          REQUESTED_VERSION: "${{ inputs.version }}"
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "::error::Relay releases must run from the configured default branch"
            exit 2
          fi
          declared_version="$(python3 -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["version"])')"
          if [[ "${REQUESTED_VERSION}" != "${declared_version}" ]]; then
            echo "::error::manual version does not match release.json authority"
            exit 2
          fi

      - name: Validate Relay before packaging
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_actions.py
          python3 -m unittest discover \
            --start-directory tests \
            --pattern "test_*.py" \
            --verbose
          python3 -m compileall -q actions scripts tests

      - name: Build deterministic github-action profile bundle
        shell: bash
        env:
          RELEASE_VERSION: "${{ inputs.version }}"
        run: |
          set -euo pipefail
          bundle=".relay/release-bundle"
          mkdir --parents "${bundle}"
          cp "action-catalog.json" "${bundle}/action-catalog.json"
          cp "workflow-catalog.json" "${bundle}/workflow-catalog.json"
          tar \
            --create \
            --file - \
            --format "posix" \
            --group 0 \
            --mtime "@0" \
            --numeric-owner \
            --owner 0 \
            --sort "name" \
            ".github/workflows" "actions" "schemas" \
          | gzip --no-name > "${bundle}/relay-${RELEASE_VERSION}.tar.gz"
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          bundle = Path(".relay/release-bundle")
          documents = {
              "provenance.json": {
                  "schema": "egohygiene.relay-source-provenance/v1",
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "source_revision": os.environ["GITHUB_SHA"],
                  "builder": "egohygiene/relay/.github/workflows/release.yml",
              },
              "sbom.spdx.json": {
                  "spdxVersion": "SPDX-2.3",
                  "dataLicense": "CC0-1.0",
                  "SPDXID": "SPDXRef-DOCUMENT",
                  "name": f"relay-{os.environ['RELEASE_VERSION']}",
                  "documentNamespace": (
                      "https://egohygiene.github.io/relay/sbom/"
                      f"{os.environ['GITHUB_SHA']}"
                  ),
                  "creationInfo": {
                      "created": "1970-01-01T00:00:00Z",
                      "creators": ["Tool: egohygiene/relay"],
                  },
                  "packages": [],
              },
              "signature.json": {
                  "schema": "egohygiene.relay-signature-status/v1",
                  "state": "unavailable",
                  "reason": "Relay records checksums and provenance; cryptographic release signing is not configured.",
              },
          }
          for name, document in documents.items():
              (bundle / name).write_text(
                  json.dumps(document, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PYTHON
          (
            cd "${bundle}"
            find . -maxdepth 1 -type f ! -name "SHA256SUMS" -print \
              | sed 's#^./##' \
              | sort \
              | xargs sha256sum > "SHA256SUMS"
          )

      - name: Upload caller-owned release bundle
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "relay-release-bundle-${{ github.sha }}"
          path: ".relay/release-bundle"
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  release:
    name: Verify and publish Relay's immutable release
    needs: bundle
    permissions:
      actions: read
      contents: write
    uses: $/.github/workflows/semantic-release.yml
    with:
      artifact-name: "relay-release-bundle-${{ github.sha }}"
      release-version: "${{ inputs.version }}"
      profile: "github-action"
      release-name: "relay"
      component-id: "relay"
      expected-source-revision: "${{ github.sha }}"
      update-major-alias: "${{ inputs.update-major-alias }}"
      artifact-retention-days: 30
