# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Dependency review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: "dependency-review-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Analyse dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden runner
        # step-security/harden-runner v2.21.0
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Analyse dependency changes
        # actions/dependency-review-action v4.9.0
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: high
          deny-licenses: "GPL-2.0, GPL-3.0"
