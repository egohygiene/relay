# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Validate Relay actions

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "relay-validation-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate catalog, contracts, implementations, and metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden runner
        # step-security/harden-runner v2.21.0
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout Relay
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate action catalog and metadata
        run: python3 scripts/validate_actions.py

      - name: Validate CI run lifecycle contract
        run: python3 scripts/validate_ci_run_lifecycle.py

      - name: Validate continuity preflight contracts
        run: python3 scripts/validate_continuity_preflight_contract.py validate

      - name: Validate repository journal runtime contract
        run: python3 scripts/validate_repository_journal_runtime.py validate

      - name: Run unit and integration tests
        run: >-
          python3 -m unittest discover
          --start-directory tests
          --pattern "test_*.py"
          --verbose

      - name: Compile Python sources
        run: python3 -m compileall -q actions scripts tests

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "${script}"
          done < <(find actions scripts -type f \( -name "*.sh" -o -name "repo-activity" \) -print | sort)

      - name: Validate inline Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          destination="${RUNNER_TEMP}/relay-inline-shell"
          mkdir -p "${destination}"
          ruby -r psych -e '
            destination = ARGV.fetch(0)
            scripts = []
            Dir["actions/*/action.yml"].sort.each do |path|
              document = Psych.safe_load_file(path, aliases: true)
              Array(document.dig("runs", "steps")).each_with_index do |step, index|
                if step.is_a?(Hash) && step["shell"] == "bash" && step["run"]
                  scripts << [path, "step #{index + 1}", step["run"]]
                end
              end
            end
            Dir[".github/workflows/*.{yml,yaml}"].sort.each do |path|
              document = Psych.safe_load_file(path, aliases: true)
              (document["jobs"] || {}).each do |job_name, job|
                Array(job["steps"]).each_with_index do |step, index|
                  if step.is_a?(Hash) && step["run"]
                    scripts << [path, "#{job_name} step #{index + 1}", step["run"]]
                  end
                end
              end
            end
            scripts.each_with_index do |(path, label, script), index|
              File.write(
                File.join(destination, format("%03d.sh", index)),
                "# #{path}: #{label}\n#{script}\n",
              )
            end
            puts "Extracted #{scripts.length} inline shell blocks"
          ' "${destination}"
          while IFS= read -r script; do
            bash -n "${script}"
          done < <(find "${destination}" -type f -name "*.sh" -print | sort)

      - name: Parse JSON contracts and fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json
          from pathlib import Path

          paths = [
              Path("action-catalog.json"),
              Path("workflow-catalog.json"),
              Path("release.json"),
              Path("release-profiles.json"),
          ]
          paths.extend(sorted(
              path
              for root in (Path("actions"), Path("schemas"), Path("tests/fixtures"))
              for path in root.rglob("*.json")
          ))
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"Parsed {len(paths)} JSON documents")
          PYTHON

      - name: Parse action and workflow YAML metadata
        shell: bash
        run: |
          set -euo pipefail
          ruby -e '
            require "psych"
            paths = Dir["actions/*/action.yml", ".github/workflows/*.{yml,yaml}"].sort
            paths.each { |path| Psych.parse_file(path) }
            puts "Parsed #{paths.length} YAML metadata documents"
          '

      - name: Exercise disposable failing report producer
        id: ci-report-lifecycle-check
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ".reports/ci-report-lifecycle-smoke"
          printf '{"expected_outcome":"failure","fixture":"disposable"}\n' \
            > ".reports/ci-report-lifecycle-smoke/result.json"
          exit 1

      - name: Preserve disposable failure evidence
        id: ci-report-lifecycle-report
        if: "${{ always() }}"
        uses: ./actions/preserve-ci-report
        with:
          producer: "ci-report-lifecycle-smoke"
          outcome: "${{ steps.ci-report-lifecycle-check.outcome }}"
          retention-days: "1"

      - name: Verify disposable failure evidence
        if: "${{ always() }}"
        shell: bash
        env:
          CI_REPORT_ARTIFACT_ID: "${{ steps.ci-report-lifecycle-report.outputs.artifact-id }}"
          CI_REPORT_CHECK_OUTCOME: "${{ steps.ci-report-lifecycle-check.outcome }}"
          CI_REPORT_COMPLETENESS: "${{ steps.ci-report-lifecycle-report.outputs.completeness }}"
          CI_REPORT_MANIFEST_SHA256: "${{ steps.ci-report-lifecycle-report.outputs.manifest-sha256 }}"
        run: |
          set -euo pipefail
          [[ "${CI_REPORT_CHECK_OUTCOME}" == "failure" ]]
          [[ "${CI_REPORT_COMPLETENESS}" == "partial" ]]
          [[ -n "${CI_REPORT_ARTIFACT_ID}" ]]
          [[ "${CI_REPORT_MANIFEST_SHA256}" =~ ^[0-9a-f]{64}$ ]]

      - name: Upload repository-journal evidence fixture
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relay-repository-journal-evidence
          path: tests/fixtures/repository-journal/repository-journal-evidence.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload repository-journal candidate fixture
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relay-repository-journal-candidate
          path: tests/fixtures/repository-journal/repository-journal-candidate.json
          if-no-files-found: error
          retention-days: 1

  repository-journal-manual-smoke:
    name: Validate reviewed manual repository-journal fixtures
    needs: validate
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      security-events: read
    uses: $/.github/workflows/repository-journal.yml
    with:
      mode: manual
      repository-id: egohygiene/relay
      repository-revision: "1111111111111111111111111111111111111111"
      interval-start: "2026-09-01T00:00:00Z"
      interval-end: "2026-09-08T00:00:00Z"
      generated-at: "2026-09-08T00:00:00Z"
      evidence-artifact-name: relay-repository-journal-evidence
      candidate-artifact-name: relay-repository-journal-candidate
      artifact-retention-days: 1

  repository-journal-smoke-outputs:
    name: Confirm repository-journal outputs
    needs: repository-journal-manual-smoke
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Harden runner
        # step-security/harden-runner v2.21.0
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Validate repository-journal evidence outputs
        shell: bash
        env:
          COMPLETENESS: "${{ needs.repository-journal-manual-smoke.outputs.evidence-completeness }}"
          JOURNAL_ARTIFACT_NAME: "${{ needs.repository-journal-manual-smoke.outputs.journal-artifact-name }}"
          RESULT_SHA256: "${{ needs.repository-journal-manual-smoke.outputs.result-sha256 }}"
          STATUS: "${{ needs.repository-journal-manual-smoke.outputs.status }}"
        run: |
          set -euo pipefail
          [[ "${STATUS}" == "complete" ]]
          [[ "${COMPLETENESS}" == "complete" ]]
          [[ "${JOURNAL_ARTIFACT_NAME}" == relay-repository-journal-* ]]
          [[ "${RESULT_SHA256}" =~ ^[0-9a-f]{64}$ ]]

  artifact-budget-fixture:
    name: Build caller-owned artifact budget fixtures
    needs: validate
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Harden runner
        # step-security/harden-runner v2.21.0
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Stage deterministic current and baseline artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path

          Path(".relay/current").mkdir(parents=True)
          Path(".relay/baseline").mkdir(parents=True)
          Path(".relay/current/index.html").write_bytes(b"current artifact\n")
          Path(".relay/baseline/index.html").write_bytes(b"baseline\n")
          PYTHON

      - name: Upload current artifact fixture
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relay-artifact-budget-current
          path: .relay/current
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload baseline artifact fixture
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relay-artifact-budget-baseline
          path: .relay/baseline
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  artifact-budget-smoke:
    name: Evaluate caller-owned artifact budget fixtures
    needs: artifact-budget-fixture
    permissions:
      contents: read
    uses: $/.github/workflows/artifact-budget.yml
    with:
      current-artifact-name: relay-artifact-budget-current
      baseline-artifact-name: relay-artifact-budget-baseline
      adapter: filesystem
      artifact-kind: static-site
      subject: relay-static-site
      current-revision: "${{ github.sha }}"
      baseline-revision: "${{ github.sha }}"
      mode: blocking
      maximum-increase-bytes: "16"
      artifact-retention-days: 1

  artifact-budget-smoke-outputs:
    name: Confirm artifact budget outputs
    needs: artifact-budget-smoke
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Harden runner
        # step-security/harden-runner v2.21.0
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Validate artifact budget evidence outputs
        shell: bash
        env:
          MEASUREMENT_COUNT: "${{ needs.artifact-budget-smoke.outputs.measurement-count }}"
          REPORT_ARTIFACT_NAME: "${{ needs.artifact-budget-smoke.outputs.report-artifact-name }}"
          REPORT_SHA256: "${{ needs.artifact-budget-smoke.outputs.report-sha256 }}"
          STATUS: "${{ needs.artifact-budget-smoke.outputs.status }}"
        run: |
          set -euo pipefail
          [[ "${STATUS}" == "pass" ]]
          [[ "${MEASUREMENT_COUNT}" == "1" ]]
          [[ "${REPORT_ARTIFACT_NAME}" == relay-artifact-budget-* ]]
          [[ "${REPORT_SHA256}" =~ ^[0-9a-f]{64}$ ]]

  publication-site-fixture:
    name: Build caller-owned publication fixture
    needs: validate
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Harden runner
        # step-security/harden-runner v2.21.0
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout Relay fixture source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Stage a complete static publication site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          from tests.test_publication_site_validation import build_site

          _, site = build_site(
              Path("."),
              "repository-subpath",
              revision=os.environ["GITHUB_SHA"],
          )
          print(f"Staged caller-owned publication fixture at {site}")
          PYTHON

      - name: Upload caller-owned static-site artifact
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relay-publication-site-fixture
          path: dist/repository-subpath
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  publication-review-smoke:
    name: Review caller-owned publication fixture
    needs: publication-site-fixture
    permissions:
      actions: read
      contents: read
    uses: $/.github/workflows/publication-review.yml
    with:
      artifact-name: relay-publication-site-fixture
      expected-base-url: "https://example.github.io/publication/"
      expected-source-revision: "${{ github.sha }}"
      required-routes: '["", "paper/", "magazine/", "downloads/"]'
      artifact-retention-days: 1

  publication-review-smoke-outputs:
    name: Confirm review-only publication outputs
    needs: publication-review-smoke
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Harden runner
        # step-security/harden-runner v2.21.0
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Validate review evidence outputs
        shell: bash
        env:
          EVIDENCE_ARTIFACT: "${{ needs.publication-review-smoke.outputs.evidence-artifact-name }}"
          FILE_COUNT: "${{ needs.publication-review-smoke.outputs.file-count }}"
          REVIEW_ARTIFACT: "${{ needs.publication-review-smoke.outputs.review-artifact-name }}"
          SITE_TREE_SHA256: "${{ needs.publication-review-smoke.outputs.site-tree-sha256 }}"
          TOTAL_BYTES: "${{ needs.publication-review-smoke.outputs.total-bytes }}"
        run: |
          set -euo pipefail
          [[ "${EVIDENCE_ARTIFACT}" =~ ^publication-pages-validation- ]]
          [[ "${REVIEW_ARTIFACT}" =~ ^publication-pages-review- ]]
          [[ "${FILE_COUNT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${SITE_TREE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${TOTAL_BYTES}" =~ ^[1-9][0-9]*$ ]]

  intelligence-smoke:
    name: Exercise reusable workflow without producer reports
    needs: validate
    permissions:
      contents: read
    uses: $/.github/workflows/repository-intelligence.yml
    with:
      output-directory: "dist/intelligence"
      work-directory: ".cache/repository-intelligence"
      reports-directory: ".reports"
      activity-since: "1 year ago"
      max-depth: "10"
      artifact-retention-days: 1
