name: Repository Journal Dogfood

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "relay-repository-journal-dogfood-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  interval:
    name: Define explicit seven-day reporting interval
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      start: "${{ steps.interval.outputs.start }}"
      end: "${{ steps.interval.outputs.end }}"

    steps:
      - name: Harden runner
        # step-security/harden-runner v2.21.0
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - id: interval
        name: Calculate UTC interval once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from datetime import datetime, timedelta, timezone
          import os

          end = datetime.now(timezone.utc).replace(microsecond=0)
          start = end - timedelta(days=7)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"start={start.isoformat().replace('+00:00', 'Z')}\n")
              stream.write(f"end={end.isoformat().replace('+00:00', 'Z')}\n")
          PYTHON

  journal:
    name: Render deterministic no-billing journal
    needs: interval
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      security-events: read
    uses: ./.github/workflows/repository-journal.yml
    with:
      mode: deterministic
      repository-id: "${{ github.repository }}"
      repository-revision: "${{ github.sha }}"
      interval-start: "${{ needs.interval.outputs.start }}"
      interval-end: "${{ needs.interval.outputs.end }}"
      generated-at: "${{ needs.interval.outputs.end }}"
      artifact-retention-days: 30
