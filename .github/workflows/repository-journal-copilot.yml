# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Repository Journal with Copilot

on:
  workflow_call:
    inputs:
      repository-id:
        description: Exact owner/name repository identity.
        required: true
        type: string
      repository-revision:
        description: Full Git SHA represented by the journal.
        required: true
        type: string
      interval-start:
        description: Inclusive UTC RFC 3339 reporting interval start.
        required: true
        type: string
      interval-end:
        description: Inclusive UTC RFC 3339 reporting interval end.
        required: true
        type: string
      generated-at:
        description: Explicit UTC RFC 3339 generation timestamp.
        required: true
        type: string
      evidence-artifact-name:
        description: Optional caller-produced artifact containing repository-journal-evidence.json.
        required: false
        default: ""
        type: string
      previous-result-artifact-name:
        description: Optional artifact containing a prior repository-journal-result.json.
        required: false
        default: ""
        type: string
      auth-mode:
        description: Explicit authentication mode; github-token or fine-grained-pat.
        required: false
        default: github-token
        type: string
      organization-policy-state:
        description: Reviewed organization Copilot CLI policy state.
        required: false
        default: unknown
        type: string
      permission-state:
        description: Reviewed Copilot Requests workflow permission state.
        required: false
        default: unknown
        type: string
      billing-acknowledged:
        description: Whether the selected billing principal has been explicitly acknowledged.
        required: false
        default: false
        type: boolean
      maximum-pages:
        description: Maximum GitHub API pages read per evidence source.
        required: false
        default: 2
        type: number
      maximum-records:
        description: Maximum normalized records retained per evidence source.
        required: false
        default: 50
        type: number
      maximum-items:
        description: Maximum accepted Copilot candidate items across all sections.
        required: false
        default: 100
        type: number
      artifact-retention-days:
        description: Retention for the complete journal evidence bundle.
        required: false
        default: 30
        type: number
    secrets:
      copilot-token:
        description: Optional explicitly selected fine-grained PAT with Copilot Requests permission.
        required: false
    outputs:
      journal-artifact-name:
        description: Uploaded artifact containing evidence, candidate, result, and rendered journal.
        value: "${{ jobs.journal.outputs.journal-artifact-name }}"
      result-sha256:
        description: SHA-256 of the exact machine-readable result.
        value: "${{ jobs.journal.outputs.result-sha256 }}"
      status:
        description: Complete, partial, unavailable, or failed journal status.
        value: "${{ jobs.journal.outputs.status }}"
      evidence-completeness:
        description: Complete, partial, or unavailable evidence state.
        value: "${{ jobs.journal.outputs.evidence-completeness }}"

permissions:
  contents: read

concurrency:
  group: "relay-repository-journal-copilot-${{ github.repository }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  journal:
    name: Generate one no-tool Copilot candidate and validate it
    permissions:
      actions: read
      contents: read
      copilot-requests: write
      issues: read
      pull-requests: read
      security-events: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      journal-artifact-name: "${{ steps.metadata.outputs.artifact-name }}"
      result-sha256: "${{ steps.render.outputs.result-sha256 }}"
      status: "${{ steps.render.outputs.status }}"
      evidence-completeness: "${{ steps.render.outputs.evidence-completeness }}"

    steps:
      - name: Harden runner
        # step-security/harden-runner v2.21.0
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Select pinned Node.js runtime
        # actions/setup-node v6.1.0
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: "24"

      - name: Download caller-owned evidence
        if: "${{ inputs.evidence-artifact-name != '' }}"
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: "${{ inputs.evidence-artifact-name }}"
          path: .relay/repository-journal/inputs/evidence

      - name: Download prior successful result
        if: "${{ inputs.previous-result-artifact-name != '' }}"
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: "${{ inputs.previous-result-artifact-name }}"
          path: .relay/repository-journal/inputs/previous

      - id: paths
        name: Resolve exact input paths
        shell: bash
        env:
          EVIDENCE_ARTIFACT_NAME: "${{ inputs.evidence-artifact-name }}"
          PREVIOUS_RESULT_ARTIFACT_NAME: "${{ inputs.previous-result-artifact-name }}"
        run: |
          set -euo pipefail
          evidence_path=""
          previous_path=""
          if [[ -n "${EVIDENCE_ARTIFACT_NAME}" ]]; then
            evidence_path=".relay/repository-journal/inputs/evidence/repository-journal-evidence.json"
            [[ -f "${evidence_path}" ]]
          fi
          if [[ -n "${PREVIOUS_RESULT_ARTIFACT_NAME}" ]]; then
            previous_path=".relay/repository-journal/inputs/previous/repository-journal-result.json"
            [[ -f "${previous_path}" ]]
          fi
          printf 'evidence-path=%s\n' "${evidence_path}" >> "${GITHUB_OUTPUT}"
          printf 'previous-path=%s\n' "${previous_path}" >> "${GITHUB_OUTPUT}"

      - id: metadata
        name: Define unique journal artifact identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'artifact-name=relay-repository-journal-copilot-%s-%s\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - id: render
        name: Generate and validate repository journal
        continue-on-error: true
        uses: $/actions/repository-journal
        with:
          mode: copilot
          repository: "${{ inputs.repository-id }}"
          revision: "${{ inputs.repository-revision }}"
          interval-start: "${{ inputs.interval-start }}"
          interval-end: "${{ inputs.interval-end }}"
          generated-at: "${{ inputs.generated-at }}"
          github-token: "${{ github.token }}"
          evidence-path: "${{ steps.paths.outputs.evidence-path }}"
          previous-result-path: "${{ steps.paths.outputs.previous-path }}"
          auth-mode: "${{ inputs.auth-mode }}"
          copilot-token: "${{ secrets.copilot-token }}"
          organization-policy-state: "${{ inputs.organization-policy-state }}"
          permission-state: "${{ inputs.permission-state }}"
          billing-acknowledged: "${{ inputs.billing-acknowledged }}"
          maximum-pages: "${{ inputs.maximum-pages }}"
          maximum-records: "${{ inputs.maximum-records }}"
          maximum-items: "${{ inputs.maximum-items }}"
          output-directory: .relay/repository-journal/output

      - name: Publish bounded workflow summary
        if: "${{ always() }}"
        shell: bash
        run: |
          set -euo pipefail
          summary=".relay/repository-journal/output/repository-journal-summary.md"
          journal=".relay/repository-journal/output/repository-journal.md"
          if [[ -f "${summary}" ]]; then
            cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
            if [[ -f "${journal}" ]]; then
              printf '\n---\n\n' >> "${GITHUB_STEP_SUMMARY}"
              cat "${journal}" >> "${GITHUB_STEP_SUMMARY}"
            fi
          else
            printf '# Repository Journal\n\nStatus: **failed before evidence was produced**.\n' \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload complete journal evidence bundle
        if: "${{ always() && steps.metadata.outputs.artifact-name != '' }}"
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "${{ steps.metadata.outputs.artifact-name }}"
          path: .relay/repository-journal/output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: "${{ inputs.artifact-retention-days }}"
          compression-level: 9

      - name: Fail after preserving rejected evidence
        if: "${{ steps.render.outcome == 'failure' }}"
        shell: bash
        run: exit 1
