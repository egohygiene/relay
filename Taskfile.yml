---
version: "3"

vars:
  RELEASE_VERSION:
    sh: python3 -c "import json; print(json.load(open(\"release.json\", encoding=\"utf-8\"))[\"version\"])"

tasks:
  continuity:contract:check:
    desc: Validate the pinned continuity preflight profile and schemas offline
    cmds:
      - python3 scripts/validate_continuity_preflight_contract.py validate

  continuity:sources:verify:
    desc: Verify every pinned continuity artifact from explicit local checkouts
    requires:
      vars:
        - AETHER_SOURCE
        - HYGIENE_SOURCE
        - EGOLINT_SOURCE
        - HOLON_SOURCE
    cmds:
      - >-
        python3 scripts/validate_continuity_preflight_contract.py verify-sources
        --aether-source "{{.AETHER_SOURCE}}"
        --hygiene-source "{{.HYGIENE_SOURCE}}"
        --egolint-source "{{.EGOLINT_SOURCE}}"
        --holon-source "{{.HOLON_SOURCE}}"

  continuity:preflight:
    desc: Run the read-only local continuity preflight from explicit inputs
    requires:
      vars: [REQUEST, EGOLINT_SOURCE, CONTINUITY_POLICY]
    cmds:
      - >-
        python3 actions/repository-continuity-preflight/scripts/run_repository_continuity_preflight.py
        --repository-root "."
        --request "{{.REQUEST}}"
        --egolint-source "{{.EGOLINT_SOURCE}}"
        --continuity-policy "{{.CONTINUITY_POLICY}}"

  release:plan:
    desc: Render a read-only plan for the next unpromoted Relay release
    requires:
      vars:
        - RELEASE_VERSION
    cmds:
      - >-
        python3 actions/verify-release-plan/scripts/verify_release_plan.py
        --repository "."
        --repository-id "egohygiene/relay"
        --component-id "relay"
        --release-version "{{.RELEASE_VERSION}}"
        --profile "github-action"
        --source-revision "$(git rev-parse HEAD^{commit})"
        --default-branch "$(git remote show origin | sed -n 's/.*HEAD branch: //p')"
        --mode "plan"
        --profiles-path "release-profiles.json"
        --relay-root "."
        --evidence-output ".relay/release-plan-evidence.json"

  release:prepare:
    desc: Verify the read-only inputs for a reviewed Relay release PR
    cmds:
      - task: release:plan
        vars:
          RELEASE_VERSION: "{{.RELEASE_VERSION}}"

  release:verify:
    desc: Verify a promoted Relay release and its complete github-action bundle
    requires:
      vars:
        - RELEASE_BUNDLE
        - RELEASE_VERSION
    cmds:
      - >-
        python3 actions/verify-release-plan/scripts/verify_release_plan.py
        --repository "."
        --repository-id "egohygiene/relay"
        --component-id "relay"
        --release-version "{{.RELEASE_VERSION}}"
        --profile "github-action"
        --source-revision "$(git rev-parse HEAD^{commit})"
        --default-branch "$(git remote show origin | sed -n 's/.*HEAD branch: //p')"
        --mode "verify"
        --bundle-directory "{{.RELEASE_BUNDLE}}"
        --profiles-path "release-profiles.json"
        --relay-root "."
        --evidence-output ".relay/release-plan-evidence.json"

  release:publish:
    desc: Dispatch the reviewed current-default-branch Relay release
    requires:
      vars:
        - RELEASE_VERSION
    cmds:
      - >-
        gh workflow run "release.yml"
        --ref "$(git remote show origin | sed -n 's/.*HEAD branch: //p')"
        --field "version={{.RELEASE_VERSION}}"
        --field "update-major-alias=true"
